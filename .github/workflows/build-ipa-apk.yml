name: Build iOS IPA & Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. BUILD IOS IPA (SideStore / AltStore Sideload Ready)
  # ============================================================================
  build-ios:
    name: Build iOS IPA (SideStore Ready)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web & Sync Capacitor iOS
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          npx cap sync ios

      - name: Archive iOS App (Unsigned for SideStore)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA for SideStore Sideload
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build/App.xcarchive/Products/Applications"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr TTS-Bareng.ipa Payload
          ls -lh TTS-Bareng.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-bareng-ios-ipa
          path: build/TTS-Bareng.ipa

  # ============================================================================
  # 2. BUILD ANDROID APK
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install

      - name: Build Web & Sync Capacitor Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in android/app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-apk/TTS-Bareng.apk
          ls -lh build-apk/TTS-Bareng.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-bareng-android-apk
          path: build-apk/TTS-Bareng.apk

  # ============================================================================
  # 3. CREATE GITHUB RELEASE (Triggered on Tag Push)
  # ============================================================================
  release:
    name: Create GitHub Release with IPA & APK
    needs: [build-ios, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: tts-bareng-ios-ipa
          path: ./release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: tts-bareng-android-apk
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} — TTS Bareng
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/TTS-Bareng.ipa
            release-assets/TTS-Bareng.apk
